<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Christmas List</title>
  <style>
    body {
      background: linear-gradient(135deg, #f9f9f9, #ececec);
      font-family: "Poppins", sans-serif;
      color: #333;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    header {
      position: sticky;
      top: 0;
      background-color: #ffffff;
      color: #2c2c2c;
      padding: 25px 0;
      font-size: 1.8em;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      z-index: 10;
    }

    #countdown {
      position: absolute;
      right: 20px;
      top: 25px;
      background: #fff;
      color: #333;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 0.9em;
      font-weight: 600;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }

    main {
      margin: 60px auto;
      max-width: 600px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      padding: 40px 30px;
      transition: all 0.3s ease;
    }

    main:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h2 {
      color: #2c2c2c;
      margin-bottom: 25px;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      margin: 18px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding-bottom: 10px;
    }

    a {
      color: #333;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }

    a:hover {
      color: #000;
      text-decoration: underline;
    }

    button {
      background: #f2f2f2;
      color: #333;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 6px 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover {
      background: #e6e6e6;
      transform: scale(1.05);
    }

    footer {
      margin-top: 40px;
      font-size: 0.9em;
      color: #777;
    }

    footer a {
      color: #555;
      text-decoration: none;
      transition: color 0.2s;
    }

    footer a:hover {
      color: #000;
      text-decoration: underline;
    }

    #deskBtn {
      position: fixed;
      top: 50%;
      left: 15px;
      transform: translateY(-50%);
      background: #333;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1em;
      box-shadow: 0 0 8px rgba(0,0,0,0.25);
      transition: 0.2s;
    }

    #deskBtn:hover {
      background: #555;
      transform: translateY(-50%) scale(1.05);
    }
  </style>
</head>
<body>
  <header>
    Christmas
    <div id="countdown"></div>
  </header>

  <button id="deskBtn" onclick="window.open('Desk.html', '_blank')">🛠 Desk Build</button>

  <main>
    <h2>list</h2>
    <ul>
      <li>
        <a href="https://www.amazon.co.uk/UGREEN-Printer-Braided-Compatible-Scanners/dp/B086ZH1MLV/ref=sr_1_4?sr=8-4" target="_blank">usb cable for piano</a>
        <button data-id="piano-usb">Add</button>
      </li>
      <li>
        <a href="https://www.apple.com/shop/buy-airpods/airpods-pro-3" target="_blank">Airpod Pro's</a>
        <button data-id="gpu">Add</button>
      </li>
      <li>
        <a href="https://www.amazon.co.uk/ProtoArc-EC100-Ergonomic-Office-Chair/dp/B0DRY26DQK" target="_blank">chair</a>
        <button data-id="chair">Add</button>
      </li>
      <li>
        <a href="https://cleens.co.uk/products/pulse-runner-graphite?variant=46645701279984" target="_blank">shoes</a>
        <button data-id="shoes">Add</button>
      </li>
      <li>
        <a href="https://www.amazon.co.uk/dp/B0C6QYR9GQ?ref=emc_s_m_5_i_atc&th=1" target="_blank">Digital Piano</a>
        <button data-id="digital-piano">Add</button>
      </li>
    </ul>
  </main>

  <footer>😎</footer>

  <script>
    function updateCountdown() {
      const christmas = new Date("December 25, 2025 00:00:00").getTime();
      const now = new Date().getTime();
      const diff = christmas - now;

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      const el = document.getElementById("countdown");
      if (diff > 0) {
        el.textContent = `${days}d ${hours}h ${minutes}m ${seconds}s`;
      } else {
        el.textContent = "Christmas";
      }
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();

    let saved = JSON.parse(localStorage.getItem("xmasList")) || [];

    function renderButtons() {
      document.querySelectorAll("[data-id]").forEach(item => {
        const id = item.getAttribute("data-id");
        const parent = item.parentElement;

        if (saved.includes(id)) {
          parent.querySelectorAll('.actionContainer').forEach(e => e.remove());
          const container = document.createElement('span');
          container.className = 'actionContainer';
          container.innerHTML = `✅ <button class='removeBtn' data-remove="${id}">Remove</button>`;
          parent.appendChild(container);
          item.remove();
        }
      });
    }

    renderButtons();

    document.querySelectorAll("button[data-id]").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-id");
        if (!saved.includes(id)) {
          saved.push(id);
          localStorage.setItem("xmasList", JSON.stringify(saved));
          renderButtons();
        }
      });
    });

    document.addEventListener('click', e => {
      if (e.target.classList.contains('removeBtn')) {
        const id = e.target.getAttribute('data-remove');
        saved = saved.filter(x => x !== id);
        localStorage.setItem("xmasList", JSON.stringify(saved));

        const li = e.target.closest('li');
        const container = li.querySelector('.actionContainer');
        if (container) container.remove();

        const addBtn = document.createElement('button');
        addBtn.setAttribute('data-id', id);
        addBtn.textContent = 'Add';
        li.appendChild(addBtn);

        addBtn.addEventListener('click', () => {
          if (!saved.includes(id)) {
            saved.push(id);
            localStorage.setItem("xmasList", JSON.stringify(saved));
            renderButtons();
          }
        });
      }
    });
  </script>
</body>
</html>
